<!--
  footer-credit.html — the imprint-family credit block. This is the piece that makes
  the family legible: it names THIS imprint and links its siblings, so the five sites
  read as one label's imprints rather than five unrelated pages.

  Fill {{IMPRINT}} with the imprint identity (e.g. "Valesor Development"). Leave the
  five sibling links as-is; mark the current site with aria-current="true" so it renders
  as non-linked, muted text. "Solo7" is the parent the imprints belong to.
-->
<footer class="footer-credit container container--wide">
  <p class="footer-credit__imprint"><b>{{IMPRINT}}</b> — an imprint of Solo7.</p>
  <ul class="footer-credit__siblings" aria-label="Solo7 imprints">
    <li><a href="https://valesordev.com/">Valesor Development</a></li>
    <li><a href="https://system9studios.com/">System 9 Studios</a></li>
    <li><a href="https://solo7productions.com/">Solo7 Productions</a></li>
    <li><a href="https://solo7.media/">solo7.media</a></li>
    <li><a href="https://bashburn.com/">bashburn</a></li>
  </ul>
</footer>
